# Tema de login UPNA para Keycloak: hereda el tema clásico "keycloak" y añade los colores corporativos.
# Instalar en /opt/keycloak/themes/upna y elegirlo en Realm settings -> Themes -> Login theme
# (o solo para rt-web en Clients -> rt-web -> Login settings -> Login theme).
parent=keycloak
import=common/keycloak
styles=css/login.css css/upna.css
