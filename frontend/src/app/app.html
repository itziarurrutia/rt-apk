<mat-toolbar class="top">
  <a class="brand" routerLink="/">
    <mat-icon>support_agent</mat-icon>
    <span>RT</span>
  </a>
  <nav class="top-nav">
    @for (item of nav; track item.path) {
      <a mat-button [routerLink]="item.path" routerLinkActive="active">
        <mat-icon>{{ item.icon }}</mat-icon> {{ item.label }}
      </a>
    }
  </nav>
</mat-toolbar>

<main>
  <router-outlet />
</main>

<nav class="bottom-nav" aria-label="Navegación principal">
  @for (item of nav; track item.path) {
    <a [routerLink]="item.path" routerLinkActive="active" #rla="routerLinkActive" [attr.aria-current]="rla.isActive ? 'page' : null">
      <mat-icon>{{ item.icon }}</mat-icon>
      <span>{{ item.label }}</span>
    </a>
  }
</nav>
