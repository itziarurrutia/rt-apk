<div class="header">
  <div>
    <h1>Tickets</h1>
    <p class="subtitle">Activos asignados a ti · los 5 más recientes</p>
  </div>
  <button mat-stroked-button type="button" (click)="load()" [disabled]="loading()">
    <mat-icon>refresh</mat-icon> Actualizar
  </button>
</div>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}
@if (error(); as message) {
  <p class="error" role="alert">{{ message }}</p>
}

@if (tickets(); as list) {
  @if (list.length === 0) {
    <p class="empty">No tienes tickets activos asignados.</p>
  }

  <div class="list">
    @for (t of list; track t.id) {
      <app-ticket-card [ticket]="t" [back]="back" />
    }
  </div>
}
