spring:
  application:
    name: rt-apk-backend
  config:
    # Datos de conexión locales (RT_URL, RT_USERNAME, RT_PASSWORD...). No se sube a git;
    # copiar application-security.yml.example a application-security.yml. Las variables de entorno tienen prioridad.
    import: optional:file:${RT_CONFIG_FILE:./application-security.yml}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Realm del proyecto en Keycloak, p. ej. https://keycloak.example.org/realms/rt-mobile
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}
          # El token debe incluir aud=rt-api (audience mapper en el client del frontend)
          audiences: ${KEYCLOAK_AUDIENCE:rt-api}

rt:
  # rest1 = /REST/1.0 (texto plano) | rest2 = /REST/2.0 (JSON, migración futura) | demo = datos en memoria
  api-version: ${RT_API_VERSION:rest1}
  # Conexión: URL base del REST, usuario y contraseña. Cada petición lleva &user=...&pass=...
  url: ${RT_URL:}
  username: ${RT_USERNAME:}
  # En Podman se monta como secret y se lee con RT_PASSWORD_FILE (ver deploy/)
  password: ${RT_PASSWORD:}
  password-file: ${RT_PASSWORD_FILE:}
  time-zone: ${RT_TIME_ZONE:Europe/Madrid}
  # Rutas relativas a rt.url de los servicios propios de assets:
  #   <assets-path>/<inventario>/default, /<serie>/ns, /<usuario windows>/usuario
  assets-path: ${RT_ASSETS_PATH:/asset}
  #   <fecha-p-path>/<inventario> devuelve Fecha_p y Pass_iz
  fecha-p-path: ${RT_FECHA_P_PATH:/fecha_p}
  tls:
    # Huella SHA-256 (separadas por comas) de certificados aceptados aunque estén caducados o con otro
    # nombre, p. ej. el de rt5. Vacío = validación normal de Java.
    pinned-sha256: ${RT_TLS_PINNED_SHA256:}
  charset: UTF-8
  connect-timeout: 5s
  read-timeout: 20s

app:
  tls:
    # CA adicionales de confianza (PEM, separadas por comas). Unavarra CA2 firma los certificados de
    # Keycloak (baobab2) y rt5, y Java no la trae. Vacío = solo los certificados de Java.
    trusted-ca: ${APP_TLS_TRUSTED_CA:classpath:tls/unavarra-ca2.pem}
  tickets:
    # Vista de tickets: activos de esta cola creados en las últimas N horas
    queue: ${APP_TICKETS_QUEUE:apoyo.dpto}
    hours: ${APP_TICKETS_HOURS:5}
    # Expresión de fecha de RT; por defecto "<hours> hours ago". Se puede sustituir entera (p. ej. "2 days ago")
    updated-since: ${APP_TICKETS_UPDATED_SINCE:${app.tickets.hours} hours ago}
    # Consulta TicketSQL según el rol de Keycloak (rol: consulta). Se define en application-security.yml (ver application-security.yml.example).
    # Con varios roles se unen con OR; sin ninguno, los agentes ven la consulta por defecto de arriba.
    # {usuario} y {email} se sustituyen por los del usuario autenticado: Owner = '{usuario}'.
    queries-by-role: {}
    # Texto que ve el usuario tras "Perfil <rol>" en la vista de tickets (rol: texto). Por defecto "activos".
    descriptions-by-role: {}
  security:
    # false = sin autenticación (solo para el modo demo)
    enabled: ${APP_SECURITY_ENABLED:true}
    # Rol de realm de Keycloak que permite ver todos los tickets (no solo los propios)
    agent-role: ${APP_AGENT_ROLE:rt-agent}
    # Client público de Keycloak con el que el frontend pide el login (PKCE)
    client-id: ${KEYCLOAK_CLIENT_ID:rt-web}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8085}
  forward-headers-strategy: framework
